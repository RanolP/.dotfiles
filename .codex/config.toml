# This repo owns the user's Codex configuration and is explicitly trusted for
# direct main commits/pushes. Use full local access here so git metadata writes
# do not require per-command sandbox escalation.
approval_policy = "never"
sandbox_mode = "danger-full-access"

[[hooks.PostToolUse]]
matcher = "^apply_patch$"

[[hooks.PostToolUse.hooks]]
type = "command"
command = '''if jq -e '(.tool_input.command // "") | test("(?m)^\\*\\*\\* (Add File|Update File|Move to): .*\\.nix\\r?$")' >/dev/null; then (cd "$HOME/.dotfiles/nix" && nix fmt .); fi'''
timeout = 30
statusMessage = "Formatting Nix"
