# Shared mise global config -- the single source of truth for tool versions
# across every host. nix/home/default.nix imports this into
# `programs.mise.globalConfig` (adding darwin-only tools on top), and
# xpkg/configs/install.nu merges the Windows overlay
# (xpkg/configs/mise/config.toml) on top of it for Windows machines.
#
# Kept OUTSIDE nix/home/configs/ on purpose: editing configs/ trips the
# rebuild-enforcer Stop hook, which can't be satisfied from Windows.

[settings]
experimental = true
pipx.uvx = true

[tools]
node = "24.18.0"
python = "3.14.6"
rust = "1.96.1"
uv = "0.11.29"
fzf = "0.74.0"
bat = "0.26.1"
eza = "0.23.4"
ripgrep = "15.2.0"
fd = "10.4.2"
jq = "1.8.2"
duckdb = "1.5.4"
gh = "2.100.0"
delta = "0.19.2"
cmake = "4.4.4"
difftastic = "0.70.0"
claude = "2.1.327"
"npm:@earendil-works/pi-coding-agent" = "1.4.0"
# @ampcode/cli places its native binary in postinstall, which npm 12's allowScripts blocks
# under mise's npm backend; fetch the per-platform binary tarball directly instead.
"http:amp" = { version = "0.0.1795737653-g84af98", bin_path = "package", platforms = { macos-arm64 = { url = "https://registry.npmjs.org/@ampcode/cli-darwin-arm64/-/cli-darwin-arm64-{{version}}.tgz" }, macos-x64 = { url = "https://registry.npmjs.org/@ampcode/cli-darwin-x64/-/cli-darwin-x64-{{version}}.tgz" }, linux-arm64 = { url = "https://registry.npmjs.org/@ampcode/cli-linux-arm64/-/cli-linux-arm64-{{version}}.tgz" }, linux-x64 = { url = "https://registry.npmjs.org/@ampcode/cli-linux-x64/-/cli-linux-x64-{{version}}.tgz" }, windows-x64 = { url = "https://registry.npmjs.org/@ampcode/cli-win32-x64/-/cli-win32-x64-{{version}}.tgz" } } }
"aqua:anomalyco/opencode" = "2.4.1"
"aqua:google-antigravity/antigravity-cli" = "1.5.14"
"aqua:typst/typst" = "0.15.1"
"aqua:rclone/rclone" = "1.76.0"
"npm:@getgrit/cli" = "0.1.0-alpha.1743007075"
codex = "0.171.0"
"npm:agent-browser" = "0.34.0"
"npm:modern-web-guidance" = "0.0.196"
"npm:agent-device" = "0.20.9"
"npm:rea-agents" = "6.7.0"
"npm:ntn" = "0.21.8"
"npm:slopless" = "0.2.42"
"npm:@informalsystems/quint" = "0.33.1"
"pipx:reuse" = "6.2.0"
"pipx:google-colab-cli" = "0.7.4"
"ubi:namespacelabs/foundation" = { version = "0.0.573", exe = "nsc", matching = "nsc" }
# No Windows build upstream; `os` keeps `mise install` on Windows from failing on it.
"ubi:lightpanda-io/browser" = { version = "1.0.2", exe = "lightpanda", os = ["linux", "macos"] }
"github:blacktop/ipsw" = { version = "3.1.750", bin = "ipsw", os = ["linux", "macos"], platforms = { macos-arm64 = { asset_pattern = "ipsw_*_macOS_arm64.tar.gz" }, macos-x64 = { asset_pattern = "ipsw_*_macOS_x86_64.tar.gz" }, linux-arm64 = { asset_pattern = "ipsw_*_linux_arm64.tar.gz" }, linux-x64 = { asset_pattern = "ipsw_*_linux_x86_64.tar.gz" } } }
