# Windows mise overlay -- merged ON TOP of the shared nix source
# (nix/home/mise-global.toml) by xpkg/configs/install.nu, which writes the
# result to ~/.config/mise/config.toml. Keys here add Windows-only tools and
# override the shared `claude` entry with its Windows binary; that record has
# no `version`, so the merge keeps claude's version from the shared pin.
# Everything else (node, python, rust, bat, ripgrep, ... versions) comes from
# the shared source so the toolchain matches the nix hosts.

[tools]
"aqua:arxanas/git-branchless" = "latest"
"aqua:FiloSottile/age" = "latest"
"aqua:tummychow/git-absorb" = "latest"
"pipx:git-filter-repo" = "latest"
"aqua:rust-lang/mdBook" = "latest"
"aqua:starship/starship" = "latest"
# The release binary, not a cargo build. Pinned: the repo's "latest" release
# is the html-query-extractor crate, not hq.
"github:orf/html-query" = { version = "1.2.2", bin = "hq", version_prefix = "html-query-v" }
claude = { bin = "claude", platforms = """
[windows-x64]
bin = "claude.exe"
url = "https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases/{{ version }}/win32-x64/claude.exe"
""", url = "https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases/{{ version }}/windows-x64/claude", version_list_url = "https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases/latest" }
deno = "2"
go = "latest"
java = "temurin-25"
"npm:@google/gemini-cli" = "latest"
pnpm = "11.11.0"
typst = "latest"
