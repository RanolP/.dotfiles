# OpenAI Codex CLI config — settings only (managed by this repo).
# On activation, home-manager writes ~/.codex/config.toml = this file plus the
# [projects.*] trust blocks from the uncommitted ~/.codex/config.local.toml.
# The @codexConfig@ token in hook state keys is replaced with the generated
# config path during activation, so hook trust stays declarative and portable.
# Edit this file, then darwin-rebuild.

service_tier = "fast"
model = "gpt-5.6-terra"
model_reasoning_effort = "high"
model_verbosity = "low"
plan_mode_reasoning_effort = "xhigh"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"
web_search = "live"
file_opener = "vscode"
personality = "pragmatic"
check_for_update_on_startup = false
project_doc_fallback_filenames = []

[sandbox_workspace_write]
network_access = true

[shell_environment_policy]
experimental_use_profile = true

[tools]
web_search = true

[features]
memories = true
prevent_idle_sleep = true
hooks = true

[analytics]
enabled = false

[feedback]
enabled = false

[history]
max_bytes = 104857600

[agents]
max_depth = 2
max_concurrent_threads_per_session = 8
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "xhigh"

[tui]
vim_mode_default = false
notifications = true
notification_condition = "always"
alternate_screen = "always"
status_line = [
  "current-dir",
  "git-branch",
  "model-with-reasoning",
  "context-used",
  "five-hour-limit",
  "weekly-limit",
]

# Claude policy scripts run through the Codex payload adapter.
[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "$HOME/.codex/hooks/claude-hook-adapter.py" "$HOME/.codex/hooks/git-push-guard.py"'
timeout = 30

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "$HOME/.codex/hooks/claude-hook-adapter.py" "$HOME/.codex/hooks/git-integrity-guard.py"'
timeout = 30

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "$HOME/.codex/hooks/claude-hook-adapter.py" "$HOME/.codex/hooks/flake-stage-guard.py"'
timeout = 30

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "$HOME/.codex/hooks/claude-hook-adapter.py" "$HOME/.codex/hooks/ssh-guard.py"'
timeout = 30

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "$HOME/.codex/hooks/claude-hook-adapter.py" "$HOME/.codex/hooks/gpg-commit-guard.py"'
timeout = 30

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "$HOME/.codex/hooks/claude-hook-adapter.py" "$HOME/.codex/hooks/package-manager-guard.py"'
timeout = 30

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "$HOME/.codex/hooks/claude-hook-adapter.py" "$HOME/.codex/hooks/declarative-package-guard.py"'
timeout = 30

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "$HOME/.codex/hooks/claude-hook-adapter.py" "$HOME/.codex/hooks/gh-guard.py"'
timeout = 30

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "$HOME/.codex/hooks/claude-hook-adapter.py" "$HOME/.codex/hooks/jira-guard.py"'
timeout = 30

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "$HOME/.codex/hooks/claude-hook-adapter.py" --timeout 25 "$HOME/.codex/hooks/pr-body-guard.py"'
timeout = 30

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "$HOME/.codex/hooks/claude-hook-adapter.py" "$HOME/.codex/hooks/file-edit-guard.py"'
timeout = 30

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "$HOME/.codex/hooks/claude-hook-adapter.py" "$HOME/.codex/hooks/agent-tooling-guard.py"'
timeout = 30

[[hooks.PreToolUse]]
matcher = "^apply_patch$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "$HOME/.codex/hooks/claude-hook-adapter.py" "$HOME/.codex/hooks/claude-dir-edit-guard.py"'
timeout = 30

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "$HOME/.codex/hooks/claude-hook-adapter.py" "$HOME/.codex/hooks/prompt-authoring-guard.py"'
timeout = 30

[[hooks.PreToolUse]]
matcher = "^(spawn_agent|Agent)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "$HOME/.codex/hooks/claude-hook-adapter.py" "$HOME/.codex/hooks/orchestration-guard.py"'
timeout = 30

[[hooks.PostToolUse]]
matcher = "^apply_patch$"

[[hooks.PostToolUse.hooks]]
type = "command"
command = 'python3 "$HOME/.codex/hooks/claude-hook-adapter.py" "$HOME/.codex/hooks/rebuild-enforcer.py"'
timeout = 30

[[hooks.PostToolUse]]
matcher = "^Bash$"

[[hooks.PostToolUse.hooks]]
type = "command"
command = 'python3 "$HOME/.codex/hooks/claude-hook-adapter.py" "$HOME/.codex/hooks/missing-tool-hint.py"'
timeout = 30

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = 'python3 "$HOME/.codex/hooks/claude-hook-adapter.py" "$HOME/.codex/hooks/output-shape-reminder.py"'
timeout = 30

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = 'python3 "$HOME/.codex/hooks/claude-hook-adapter.py" "$HOME/.codex/hooks/rebuild-enforcer.py"'
timeout = 30

