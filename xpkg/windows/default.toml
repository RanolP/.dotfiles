# Windows packages for xpkg -- the Windows counterpart to nix.
# Declarative and nix-style (mirrors the homebrew block + casksByHost in
# nix/darwin/default.nix): a common [winget] set installed on every machine,
# plus per-profile ([profiles.<hostname>]) additions for a specific machine.
#
# No "optional"/prompts. The installer reads `winget list` once, skips whatever
# is already installed, installs the rest, and only WARNS about winget packages
# that are installed but not declared here -- it never uninstalls (no zap).
# The one exception is `remove`: ids listed there are uninstalled when present.

skip_dependencies = ["Nvidia.CUDA"]

remove = [
  "Bandisoft.Bandizip",
]

# Installed on every Windows profile.
[winget]
packages = [
  "7zip.7zip",
  "9PFXXSHC64H3", # Raycast (msstore; not in the winget source)
  "AntibodySoftware.WizTree",
  "Bitwarden.Bitwarden",
  "Canva.Affinity",
  "CrystalDewWorld.CrystalDiskInfo.ShizukuEdition",
  "DigitalScholar.Zotero",
  "Discord.Discord",
  "EclipseAdoptium.Temurin.21.JDK",
  "Espanso.Espanso",
  "FTB.App",
  "gerardog.gsudo",
  "Git.Git",
  "GitHub.cli",
  "Google.Chrome",
  "Google.GoogleDrive",
  "Google.QuickShare",
  "Gyan.FFmpeg",
  "jdx.mise",
  "JetBrains.Toolbox",
  "Kakao.KakaoTalk",
  "Keybase.Keybase",
  "M2Team.NanaZip",
  "Microsoft.VisualStudio.BuildTools", # MSVC + Windows 11 SDK, see [winget.override]
  "Microsoft.VisualStudioCode",
  "Microsoft.WSL",
  "Microsoft.WindowsTerminal",
  "Mozilla.Firefox.DeveloperEdition",
  "Nushell.Nushell",
  "Nvidia.CUDA",
  "OBSProject.OBSStudio",
  "Obsidian.Obsidian",
  "PrismLauncher.PrismLauncher",
  "Rclone.Rclone",
  "ShareX.ShareX",
  "Smilegate.Stove",
  "Tailscale.Tailscale",
  "Telegram.TelegramDesktop",
  "uutils.coreutils",
  "Valve.Steam",
  "VideoLAN.VLC",
  "voidtools.Everything",
]

# Installer args winget passes with --override, for packages whose default
# install is not what is wanted. Applied on install only; an installed
# package is skipped, so a changed list needs a manual modify.
[winget.override]
"Microsoft.VisualStudio.BuildTools" = "--quiet --wait --norestart --nocache --add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --add Microsoft.VisualStudio.Component.Windows11SDK.26100"

# Not on winget, but the vendor serves a stable latest-installer URL. The key is
# the start of the installed DisplayName (`winget list` Name column) used to
# skip it when present; `args` are the installer's silent flags. A zip download names the
# installer inside it with `member`; an .msi runs through msiexec.
[direct."VoiSona Talk"]
# 302 -> cdn.voisona.com/editor/<ver>/VoiSona_Talk_Installer_<ver>.exe (Inno Setup).
url = "https://voisona.com/talk/download/windows/"
args = ["/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-"]

[direct."Little Big Mouse"]
# winget's mgth.LittleBigMouse stops at 5.2.3.0; the GitHub release asset name
# carries the version, so this pins it (Inno Setup, LittleBigMouse.Setup/LittleBigMouse.iss).
# Calibration is restored by xpkg/configs/littlebigmouse/install.nu.
url = "https://github.com/mgth/LittleBigMouse/releases/download/v5.6.0/LittleBigMouse_5.6.0.exe"
args = ["/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-"]

# The name is the MSI ProductName. A zip holding Setup.exe and the MSI; `member`
# picks the MSI so msiexec can install it silently. www.steinberg.net/asio-win
# redirects here; this static URL pins 1.0.9.
[direct."Steinberg built-in ASIO Driver 64bit"]
url = "https://download.steinberg.net/static_content/runtime-components/asio/1.0.9.26-1973a36d-45e1-3b89-b1ba-ee79d9eb03a8/Steinberg_built_in_ASIO_Driver.zip"
member = "Steinberg built-in ASIO Driver 1.0.9/Additional Content/Installer/Steinberg_Built_In_ASIO_Driver_64bit.msi"
args = ["/qn", "/norestart"]

# NVIDIA Game Ready DCH display driver for RanolP-Desktop's RTX 4070 Ti; there is
# no winget package. `direct` has no per-profile table, so this runs on every
# Windows host: move it under a profile mechanism before adding a GPU-less host.
# The key is the ARP DisplayName this installer registers under `-s`
# ("NVIDIA Graphics Driver 621.24"), even on this Korean Windows whose earlier
# install read "NVIDIA 그래픽 드라이버 610.88"; bare "NVIDIA" would also match
# CUDA and Nsight. `version` makes an
# installed entry that is older count as missing. To upgrade: pick the new
# version at nvidia.com/Download, then bump `version` and the version in `url`.
# `-s -noreboot` are the NVIDIA installer's silent flags; reboot afterwards.
[direct."NVIDIA Graphics Driver"]
version = "621.24"
url = "https://us.download.nvidia.com/Windows/621.24/621.24-desktop-win10-win11-64bit-international-dch-whql.exe"
args = ["-s", "-noreboot"]

# NVIDIA App keeps the driver current between rebuilds; the driver entry above is
# only the floor, and a newer App-installed driver still counts as installed.
# Not on winget. The URL pins the version NVIDIA's download page linked on
# 2026-11-13; the App updates itself after that, so no `version` here.
# `-s` is the silent flag Chocolatey's nvidia-app package uses.
[direct."NVIDIA app"]
url = "https://us.download.nvidia.com/nvapp/client/11.0.9.585/x64/NVIDIA_app_v11.0.9.585_x64.exe"
args = ["-s"]

# WSL distributions (`wsl --list --online` names). A missing one is installed
# with `wsl --install <name> --no-launch`, then booted once as root to create
# `user` (wheel, sudo), make it the default and write /etc/wsl.conf.
# `sparse = true` makes an existing distro's ext4.vhdx sparse so it gives freed
# space back to Windows. WSL 2.7 disabled this ("potential data corruption"),
# so it is applied with `--allow-unsafe`.
# `home-manager = true` runs xpkg/setup-scripts/linux/arch.sh in the distro on
# every rebuild: `system` as root (pacman git+nix, nix-daemon, flakes), then
# `home` as the user (clone ~/.dotfiles if missing, home-manager switch
# --flake ~/.dotfiles/nix#ranolp-archwsl). Both phases are idempotent.
[wsl.archlinux]
user = "ranolp"
sparse = true
home-manager = true

# Per-machine additions (profile = hostname). Seeded from what this machine
# actually has installed; add other machines' peripherals/vendor tools under
# their own [profiles.<hostname>] as needed (e.g. Corsair.iCUE.4,
# Nvidia.GeForceExperience on a machine that has them).
[profiles.RanolP-Desktop]
packages = [
  "BlenderFoundation.Blender",
  "Logitech.GHUB",
]
