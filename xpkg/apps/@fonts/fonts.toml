[iosevka-nerd-font]
url = "https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/Iosevka.zip"
extract = "IosevkaNerdFont-[^.]+\\.ttf"

[iosevka-term-nerd-font]
url = "https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/IosevkaTerm.zip"
extract = "IosevkaTermNerdFont-[^.]*\\.ttf"

[pretendard]
url = "https://github.com/orioncactus/pretendard/releases/download/v1.3.9/Pretendard-1.3.9.zip"
extract = "(PretendardVariable.ttf$|Pretendard-[^.]+\\.otf$)"

# No releases upstream; pinned to a commit so the zip cannot change under us.
[apple-sd-gothic-neo]
url = "https://github.com/fonts-archive/AppleSDGothicNeo/archive/336231350326bce2393013b8f1aa74f9af0eb23e.zip"
extract = "^AppleSDGothicNeo-[^.]+\\.ttf$"
# Its files name each weight as a separate family; rename-family.py fixes that.
family = "Apple SD Gothic Neo"

[silver]
url = "https://poppyworks.itch.io/silver"
manual = true
